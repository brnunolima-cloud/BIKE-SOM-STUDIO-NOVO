<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>BIKE SOM STUDIO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101010;
  color: white;
}

header {
  background: #181818;
  padding: 25px 15px;
  text-align: center;
  border-bottom: 2px solid #e5a000;
}

header h1 {
  color: #f5b400;
  margin: 0;
  font-size: 27px;
}

header p {
  color: #ccc;
  margin-bottom: 0;
}

main {
  max-width: 700px;
  margin: 35px auto;
  padding: 20px;
}

.card {
  background: #202020;
  padding: 25px;
  border-radius: 14px;
  text-align: center;
  border: 1px solid #383838;
}

.card h2 {
  color: #f5b400;
}

button {
  background: #f5b400;
  color: #111;
  border: none;
  border-radius: 8px;
  padding: 14px 25px;
  font-size: 16px;
  font-weight: bold;
  margin-top: 15px;
  cursor: pointer;
}

footer {
  text-align: center;
  color: #888;
  padding: 25px;
}
</style>
</head>

<body>

<header>
  <h1>BIKE SOM STUDIO</h1>
  <p>Estúdio profissional de criação de vinhetas</p>
</header>

<main>
  <section class="card">
    <h2>Bem-vindo ao BIKE SOM STUDIO!</h2>
    <p>Seu espaço para criação profissional de vinhetas e áudio.</p>
    <button onclick="alert('BIKE SOM STUDIO está funcionando!')">
      Começar
    </button>
  </section>
</main>

<footer>
  BIKE SOM STUDIO © 2026
</footer>

</body>
</html>
